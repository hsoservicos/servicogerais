# ═══════════════════════════════════════════════════════════════
# default.conf — Nginx Reverse Proxy (ServiceSaaS)
# ═══════════════════════════════════════════════════════════════
# / → PHP-FPM (frontend)
# /api/ → Node.js API
# /pma/ → phpMyAdmin (local only)
# NOTA: log_format fica no nível http (conf.d é incluído no http block)

# ── Logs Estruturados (nível http) ───────────────────────
log_format json escape=json '{'
    '"timestamp": "$time_iso8601",'
    '"method": "$request_method",'
    '"path": "$uri",'
    '"status_code": $status,'
    '"duration_ms": $request_time,'
    '"bytes_sent": $bytes_sent,'
    '"ip": "$remote_addr",'
    '"user_agent": "$http_user_agent",'
    '"correlation_id": "$request_id",'
    '"referer": "$http_referer"'
'}';

# ── Health Check (nível http) ────────────────────────────
map $request_uri $loggable {
    ~^/health 0;
    default 1;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    # ── Charset ────────────────────────────────────────────
    charset utf-8;

    # ── Headers de Segurança ───────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Correlation ID ─────────────────────────────────────
    add_header X-Request-ID $request_id;
    proxy_set_header X-Request-ID $request_id;

    # ── Gzip ───────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    access_log /var/log/nginx/access.log json if=$loggable;
    access_log /dev/stdout json if=$loggable;

    location = /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # ── API Proxy (Node.js) ────────────────────────────────
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Assets Estáticos (Cache Imutável) ──────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── PHP - FastCGI Pass ─────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;

        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        fastcgi_read_timeout 60s;
    }

    # ── Arquivos Estáticos do Frontend ─────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Negar Acesso a Pastas Ocultas ──────────────────────
    location ~ /\. {
        deny all;
    }
}
