# ═══════════════════════════════════════════════════════════════
# docker-compose.yml — ServiceSaaS (Serviços Flex)
# ═══════════════════════════════════════════════════════════════
# 5 serviços: nginx, php, api, pma, mysql

services:
  # ── NGINX (Reverse Proxy + Cache) ────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: flex_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web-frontend/public:/var/www/html:ro
    depends_on:
      - php
      - api
    networks:
      - flex-network
    restart: unless-stopped

  # ── PHP-FPM 8.2 (Frontend) ───────────────────────────────
  php:
    build:
      context: ./web-frontend
      dockerfile: Dockerfile
    container_name: flex_frontend_php
    volumes:
      - ./web-frontend:/var/www
      - ./web-frontend/public:/var/www/html
    environment:
      - API_BASE_URL=/api/v1
    env_file:
      - .env
    networks:
      - flex-network
    restart: unless-stopped

  # ── NODE.JS 20 (API REST) ────────────────────────────────
  api:
    build:
      context: ./api-backend
      dockerfile: Dockerfile
    container_name: flex_api_node
    volumes:
      - ./api-backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
    env_file:
      - .env
    depends_on:
  # ── CLOUDFLARE TUNNEL (Produção) ─────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: flex_cloudflared
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./scripts/cloudflare/config.yml:/etc/cloudflared/config.yml:ro
      - cloudflared_data:/home/nonroot/.cloudflared
    networks:
      - flex-network
    restart: unless-stopped
    profiles:
      - production

  mysql:
        condition: service_healthy
    networks:
      - flex-network
    restart: unless-stopped

  # ── PHPMYADMIN (Gerenciamento BD — apenas local) ─────────
  pma:
    image: phpmyadmin:5.2.1
    container_name: flex_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    depends_on:
      - mysql
    networks:
      - flex-network
    restart: unless-stopped

  # ── MYSQL 8.0 (Banco de Dados) ───────────────────────────
  mysql:
    image: mysql:8.0
    container_name: flex_mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-servicos_flex}
      MYSQL_USER: ${MYSQL_USER:-flex_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-flex_pass}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flex-network
    restart: unless-stopped

volumes:
  mysql_data:
  cloudflared_data:

networks:
  flex-network:
    driver: bridge
