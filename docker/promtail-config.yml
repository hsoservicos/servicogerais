server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: api
    static_configs:
      - targets: []
        labels:
          job: api
          __path__: /var/log/api/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            method: method
            path: path
            status: status
            duration_ms: duration_ms
      - labels:
          level:
          method:
          status:

  - job_name: nginx
    static_configs:
      - targets: []
        labels:
          job: nginx
          __path__: /var/log/nginx/*.log
